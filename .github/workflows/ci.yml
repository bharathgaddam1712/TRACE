name: Verify TRACE demo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m tracekc run --input data/sample --out out/ci
      - run: python scripts/demo_smoke.py --out out/ci
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d web
      - name: Wait for the full demo and check the browser API proxy
        run: |
          python - <<'PY'
          import json, time, urllib.request
          deadline = time.monotonic() + 180
          while True:
              try:
                  with urllib.request.urlopen('http://localhost:3000/api/incidents', timeout=3) as response:
                      assert json.load(response), 'No sample incidents'
                  with urllib.request.urlopen('http://localhost:3000', timeout=3) as response:
                      assert response.status == 200
                  break
              except Exception:
                  if time.monotonic() > deadline:
                      raise
                  time.sleep(2)
          PY
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
