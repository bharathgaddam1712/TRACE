# Judge demo: docker compose up --build
# Pipeline commits a completed result before the API and web console start.
services:
  pipeline:
    build: .
    image: trace-backend:local
    command: ["run", "--input", "/app/data", "--out", "/app/out", "--set", "engine.temp_directory=/app/spill"]
    volumes:
      - ${TRACE_INPUT_PATH:-./data/sample}:/app/data:ro
      - trace_results:/app/out
      - trace_spill:/app/spill
  api:
    build: .
    image: trace-backend:local
    command: ["serve", "--out", "/app/out", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      pipeline:
        condition: service_completed_successfully
    environment:
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-glm5.3}
      SARVAM_REASONING_EFFORT: ${SARVAM_REASONING_EFFORT:-high}
      SARVAM_MAX_TOKENS: ${SARVAM_MAX_TOKENS:-8192}
      SARVAM_TIMEOUT_SECONDS: ${SARVAM_TIMEOUT_SECONDS:-120}
      SARVAM_DAILY_REQUEST_LIMIT: ${SARVAM_DAILY_REQUEST_LIMIT:-50}
      SARVAM_DAILY_TOKEN_LIMIT: ${SARVAM_DAILY_TOKEN_LIMIT:-500000}
      TRACE_API_TOKEN: ${TRACE_API_TOKEN:-}
      TRACE_GRAPH_BACKEND: local
    ports: ["127.0.0.1:${TRACE_API_PORT:-8000}:8000"]
    volumes:
      - trace_results:/app/out
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; t=os.getenv('TRACE_API_TOKEN',''); r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'Authorization':'Bearer '+t} if t else {}); urllib.request.urlopen(r,timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      TRACE_API_URL: http://api:8000
      TRACE_API_TOKEN: ${TRACE_API_TOKEN:-}
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:${TRACE_WEB_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  trace_results:
  trace_spill:
