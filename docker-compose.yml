# 1) put logs in ./data/raw          2) docker compose run --rm pipeline
# 3) docker compose up api           4) open http://localhost:8000
services:
  pipeline:
    build: .
    command: ["run", "--input", "/app/data/raw", "--out", "/app/out"]
    volumes:
      - ./data:/app/data:ro
      - ./out:/app/out
      - ./work:/app/work          # DuckDB spill directory: keep it on an SSD
    profiles: ["run"]
  api:
    build: .
    command: ["serve", "--out", "/app/out", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-glm5.3}
      SARVAM_REASONING_EFFORT: ${SARVAM_REASONING_EFFORT:-high}
      SARVAM_MAX_TOKENS: ${SARVAM_MAX_TOKENS:-8192}
      SARVAM_TIMEOUT_SECONDS: ${SARVAM_TIMEOUT_SECONDS:-120}
      SARVAM_DAILY_REQUEST_LIMIT: ${SARVAM_DAILY_REQUEST_LIMIT:-50}
      SARVAM_DAILY_TOKEN_LIMIT: ${SARVAM_DAILY_TOKEN_LIMIT:-500000}
      TRACE_API_TOKEN: ${TRACE_API_TOKEN:-}
      TRACE_GRAPH_BACKEND: ${TRACE_GRAPH_BACKEND:-local}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    ports: ["8000:8000"]
    volumes:
      - ./out:/app/out
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
