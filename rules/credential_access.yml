# Brute force (T1110). Covers two telemetry shapes:
#  1. raw failed-logon rows  -> event_count correlation, then temporal_ordered with a success
#  2. pre-aggregated rows that carry labels_extra.failed_count_5min (SimEDR style)
title: Failed logon
id: trace-failed-logon
status: stable
description: Single failed authentication. Building block for brute-force correlations.
author: TRACE team
logsource: {category: authentication}
detection:
  selection:
    event.outcome: failure
  condition: selection
level: low
tags: [attack.credential_access, attack.t1110]
---
title: Successful logon
id: trace-successful-logon
status: stable
description: Successful authentication. Building block for brute-force-then-success.
author: TRACE team
logsource: {category: authentication}
detection:
  selection:
    event.outcome: success
  condition: selection
level: low
tags: [attack.initial_access, attack.t1078]
---
title: Brute force burst against one account from one source
id: trace-bruteforce-burst
status: stable
author: TRACE team
correlation:
  type: event_count
  rules: [trace-failed-logon]
  group-by: [user.name, source.ip]
  timespan: 5m
  condition: {gte: 20}
  generate: false
# TRACE extension: emit this correlation's own detections even though another rule references it.
trace: {always_emit: true}
level: medium
tags: [attack.credential_access, attack.t1110]
---
title: Password spraying from one source
id: trace-password-spray
status: stable
author: TRACE team
correlation:
  type: value_count
  rules: [trace-failed-logon]
  group-by: [source.ip]
  timespan: 10m
  condition: {gte: 10, field: user.name}
level: medium
tags: [attack.credential_access, attack.t1110.003]
---
title: Brute force followed by successful logon
id: trace-bruteforce-then-success
status: stable
author: TRACE team
correlation:
  type: temporal_ordered
  rules: [trace-bruteforce-burst, trace-successful-logon]
  group-by: [user.name]
  timespan: 30m
  generate: false
level: high
tags: [attack.credential_access, attack.t1110]
---
title: High rate of failed logons (pre-aggregated count)
id: trace-bruteforce-summary
status: stable
description: Matches telemetry that reports the 5-minute failure count on the event itself.
author: TRACE team
logsource: {category: authentication}
detection:
  selection:
    event.outcome: failure
    labels_extra.failed_count_5min|gte: 20
  condition: selection
level: medium
tags: [attack.credential_access, attack.t1110]
---
title: LSASS credential dumping tooling
id: trace-lsass-dump
status: experimental
author: TRACE team
logsource: {category: process_creation}
detection:
  sel_tool:
    process.command_line|contains: ['sekurlsa', 'lsass.dmp', 'comsvcs.dll, minidump', 'procdump -ma lsass']
  sel_name:
    process.name: ['mimikatz.exe', 'procdump.exe', 'procdump64.exe']
  condition: 1 of sel_*
level: critical
tags: [attack.credential_access, attack.t1003.001]
