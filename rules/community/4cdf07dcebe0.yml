title: Potential Process Reconnaissance via Wmic.EXE
id: 221b251a-357a-49a9-920a-271802777cc0
status: test
description: 'Detects the execution of "wmic" with the "process" flag, which might
  indicate an attempt to perform reconnaissance on running processes.

  Adversaries may use wmic to query for running processes and their details as part
  of their reconnaissance efforts.

  '
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wmic
author: frack113
date: 2022-01-01
modified: 2025-12-15
tags:
- attack.execution
- attack.t1047
- attack.discovery
- attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \WMIC.exe
  - OriginalFileName: wmic.exe
  selection_cli:
    CommandLine|contains: process
  filter_main_creation:
    CommandLine|contains|all:
    - call
    - create
  filter_main_terminate:
    CommandLine|contains|all:
    - call
    - terminate
  condition: all of selection* and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
simulation:
- type: atomic-red-team
  name: WMI Reconnaissance Processes
  technique: T1047
  atomic_guid: 5750aa16-0e59-4410-8b9a-8a47ca2788e2
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_wmic_recon_process/info.yml
