<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACE · Security investigations</title>
<link rel="stylesheet" href="/style.css">
<script src="/vendor/cytoscape.min.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
<header><div><strong>TRACE</strong><span class="muted"> Attack investigation</span></div><div id="health" role="status">Connecting…</div><button id="refresh">Refresh</button></header>
<section class="runbar" aria-label="Processing status"><span id="progress">Waiting for pipeline</span><span id="quality"></span></section>
<main>
<aside>
<h1>Investigations</h1>
<label>Search host, user or incident<input id="search" type="search" placeholder="Search incidents…"></label>
<div class="filters"><label>Min. risk<input id="min-score" type="number" min="0" max="100" value="0"></label><label>Status<select id="status-filter"><option value="">All statuses</option><option>new</option><option>investigating</option><option>contained</option><option>closed</option></select></label></div>
<div id="list" aria-label="Incident list"></div><button id="load-more" hidden>Load more incidents</button>
<details><summary>API connection</summary><label>Bearer token (if configured)<input id="api-token" type="password" autocomplete="off"></label><button id="connect">Connect</button></details>
</aside>
<article id="workspace"><div class="empty"><h2>Follow the evidence.</h2><p>Select an incident to inspect its timeline, relationships and possible next targets.</p></div></article>
</main>
<dialog id="evidence-dialog"><button id="close-evidence">Close</button><h2>Event evidence</h2><pre id="evidence-content"></pre></dialog>
<footer>Read → Detect → Map → Link → Graph → Predict → Investigate</footer>
</body></html>
